<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee ホーム案C — 次の予定フォーカス型</title>
<style>
  :root {
    --bg: #f2f2f7;
    --page-text: #1c1c1e;
    --phone-bg: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8e8e93;
    --border: rgba(0,0,0,0.07);
    --tabbar-bg: rgba(255,255,255,0.85);
    --hero-from: #ff6b4a;
    --hero-to: #ff9166;
    --accent: #ff6b4a;
    --dot-green: #34c759;
    --dot-purple: #af52de;
    --dot-blue: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --page-text: #f5f5f7;
      --phone-bg: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #9a9a9e;
      --border: rgba(255,255,255,0.09);
      --tabbar-bg: rgba(28,28,30,0.85);
      --hero-from: #d9502f;
      --hero-to: #b8461f;
      --accent: #ff8a68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--page-text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 40px 16px 60px;
  }
  .caption { text-align: center; max-width: 340px; }
  .caption h1 { font-size: 16px; margin: 0 0 4px; }
  .caption p { font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.5; }
  .phone {
    width: 375px;
    max-width: 100%;
    height: 780px;
    background: var(--phone-bg);
    border-radius: 44px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    border: 8px solid #0b0b0d;
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .statusicons { display: flex; align-items: center; gap: 6px; color: var(--text); }
  .appheader { padding: 4px 20px 14px; }
  .appheader h2 { margin: 0; font-size: 28px; font-weight: 800; color: var(--text); }
  .content { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }

  .hero {
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
    border-radius: 20px;
    padding: 18px 18px 16px;
    color: #fff;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero .label { font-size: 11px; font-weight: 700; opacity: 0.85; letter-spacing: 0.04em; }
  .hero .countdown {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(255,255,255,0.22);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 800;
  }
  .hero .main { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .hero .icon-circle {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .hero .title { font-size: 19px; font-weight: 800; }
  .hero .sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
  .hero .when { font-size: 12px; opacity: 0.9; margin-top: 10px; font-weight: 600; }

  .sectiontitle {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    margin: 4px 0 8px;
  }
  .crow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
  }
  .crow .cicon { flex-shrink: 0; display: flex; }
  .crow .cdate { font-size: 12px; color: var(--text-secondary); width: 34px; flex-shrink: 0; }
  .crow .ctitle { font-size: 13px; color: var(--text); font-weight: 600; }
  .crow .clist { font-size: 11px; color: var(--text-secondary); margin-left: auto; }

  .tabbar {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--tabbar-bg);
    backdrop-filter: blur(10px);
    padding: 8px 0 18px;
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text-secondary); }
  .tab.active { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <div class="caption">
    <h1>案C — 次の予定フォーカス型</h1>
    <p>直近1件を大きなカードで強調し、カウントダウン表示で緊急度を伝える案。推し活ユーザー（チケット締切・発売日）に刺さりやすい一方、リスト全体量が多いユーザーには情報が少なく見える。アイコンは線画SVGに統一。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="appheader"><h2>ホーム</h2></div>
    <div class="content">

      <div class="hero">
        <div class="countdown">あと1日</div>
        <div class="label">次の予定</div>
        <div class="main">
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M12 3c1.2 3.1-2 4.4-2 7.4a4 4 0 1 0 8 0c0-1.1-.7-2-1-2.8 1.3 1.1 2.3 3 2.3 5.2a6.3 6.3 0 1 1-12.6 0c0-4.3 3.1-6.7 5.3-9.8z"/></svg>
          </div>
          <div>
            <div class="title">燃えるゴミ</div>
            <div class="sub">三田市 ゴミの日</div>
          </div>
        </div>
        <div class="when">明日 20:00 に通知</div>
      </div>

      <div class="sectiontitle">このあとの予定</div>
      <div class="crow">
        <div class="cicon" style="color:var(--dot-purple)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a2.3 2.3 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a2.3 2.3 0 0 0 0-3.6z"/></svg>
        </div>
        <div class="cdate">9/3</div>
        <div class="ctitle">FC先行締切</div>
        <div class="clist">WORLD TOUR</div>
      </div>
      <div class="crow">
        <div class="cicon" style="color:var(--dot-blue)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="2.5" y="8" width="19" height="10" rx="4"/><circle cx="15.5" cy="12" r="0.9" fill="currentColor" stroke="none"/><circle cx="18" cy="14.5" r="0.9" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="cdate">9/8</div>
        <div class="ctitle">○○発売日</div>
        <div class="clist">ゲーム発売</div>
      </div>
      <div class="crow">
        <div class="cicon" style="color:var(--dot-green)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M3.5 10.5V9a4 4 0 0 1 4-4h13"/><path d="M7 21.5L3.5 18l3.5-3.5"/><path d="M20.5 13.5V15a4 4 0 0 1-4 4h-13"/></svg>
        </div>
        <div class="cdate">9/12</div>
        <div class="ctitle">プラスチック</div>
        <div class="clist">ゴミの日</div>
      </div>
      <div class="crow">
        <div class="cicon" style="color:var(--dot-purple)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/></svg>
        </div>
        <div class="cdate">9/15</div>
        <div class="ctitle">東京公演</div>
        <div class="clist">WORLD TOUR</div>
      </div>

    </div>
    <div class="tabbar">
      <div class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3.5 10.5L12 3.5l8.5 7"/><path d="M5.5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h3v-6h4v6h3A1.5 1.5 0 0 0 18.5 19V9.5"/></svg>
        ホーム
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="19.5" y1="19.5" x2="15.3" y2="15.3"/></svg>
        探す
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><line x1="9" y1="6.5" x2="20.5" y2="6.5"/><line x1="9" y1="12" x2="20.5" y2="12"/><line x1="9" y1="17.5" x2="20.5" y2="17.5"/><line x1="4" y1="6.5" x2="4.01" y2="6.5"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="17.5" x2="4.01" y2="17.5"/></svg>
        マイリスト
      </div>
    </div>
  </div>
</body>
</html>
