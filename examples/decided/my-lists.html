<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee マイリスト画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a; --accent-soft: #fff1ec;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07); --tabbar-bg: rgba(255,255,255,0.85);
    --dot-green: #34c759; --dot-purple: #af52de; --dot-blue: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68; --accent-soft: rgba(255,138,104,0.14);
      --card-bg: #242426; --border: rgba(255,255,255,0.09); --tabbar-bg: rgba(28,28,30,0.85);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .appheader { padding:4px 20px 10px; display:flex; align-items:center; justify-content:space-between; }
  .appheader h2 { margin:0; font-size:28px; font-weight:800; color:var(--text); }
  .gearbtn { color:var(--text-secondary); }
  .content { flex:1; overflow-y:auto; padding:4px 20px 20px; }
  .sectiontitle { font-size:13px; font-weight:700; color:var(--text-secondary); margin:16px 0 8px; text-transform:uppercase; letter-spacing:0.03em; }
  .content .sectiontitle:first-child { margin-top:4px; }
  .card { background:var(--card-bg); border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--border); }
  .card .row:first-child { border-top:none; }
  .dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .row .name { font-size:14.5px; font-weight:700; color:var(--text); }
  .row .meta { font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .row .chev { margin-left:auto; color:var(--text-secondary); flex-shrink:0; }
  .visibility {
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px;
    background:var(--border); color:var(--text-secondary); margin-left:8px;
  }
  .newrow {
    display:flex; align-items:center; gap:10px; padding:13px 14px;
    border:1.6px dashed var(--border); border-radius:14px; color:var(--accent); font-weight:700; font-size:14px;
  }
  .tabbar { display:flex; border-top:1px solid var(--border); background:var(--tabbar-bg); backdrop-filter:blur(10px); padding:8px 0 18px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--text-secondary); }
  .tab.active { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
  <div class="caption">
    <h1>マイリスト画面</h1>
    <p>「作成したリスト」と「登録しているリスト」を分けて一覧表示(§14)。所有リストには公開状態バッジを添えた。右上の歯車アイコンから設定トップへ遷移する想定。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="appheader">
      <h2>マイリスト</h2>
      <span class="gearbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 15.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.3.66.94 1.09 1.66 1.09H21a2 2 0 0 1 0 4h-.09c-.72 0-1.36.43-1.51 1z"/></svg>
      </span>
    </div>
    <div class="content">
      <div class="sectiontitle">作成したリスト</div>
      <div class="card">
        <div class="row">
          <div class="dot" style="background:var(--dot-green)"></div>
          <div>
            <div class="name">三田市 ゴミの日<span class="visibility">非公開</span></div>
            <div class="meta">4件の予定</div>
          </div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 5 16 12 9 19"/></svg></div>
        </div>
      </div>
      <div style="height:10px"></div>
      <div class="newrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新しいリストを作成
      </div>

      <div class="sectiontitle">登録しているリスト</div>
      <div class="card">
        <div class="row">
          <div class="dot" style="background:var(--dot-purple)"></div>
          <div>
            <div class="name">○○ WORLD TOUR 2027</div>
            <div class="meta">6件の予定 ・ ○○ Official</div>
          </div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 5 16 12 9 19"/></svg></div>
        </div>
        <div class="row">
          <div class="dot" style="background:var(--dot-blue)"></div>
          <div>
            <div class="name">2026年 秋の新作ゲーム発売日</div>
            <div class="meta">12件の予定 ・ ゲーム好き太郎</div>
          </div>
          <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 5 16 12 9 19"/></svg></div>
        </div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3.5 10.5L12 3.5l8.5 7"/><path d="M5.5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h3v-6h4v6h3A1.5 1.5 0 0 0 18.5 19V9.5"/></svg>
        ホーム
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="19.5" y1="19.5" x2="15.3" y2="15.3"/></svg>
        探す
      </div>
      <div class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><line x1="9" y1="6.5" x2="20.5" y2="6.5"/><line x1="9" y1="12" x2="20.5" y2="12"/><line x1="9" y1="17.5" x2="20.5" y2="17.5"/><line x1="4" y1="6.5" x2="4.01" y2="6.5"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="17.5" x2="4.01" y2="17.5"/></svg>
        マイリスト
      </div>
    </div>
  </div>
</body>
</html>
