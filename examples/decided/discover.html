<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee 探す画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a; --accent-soft: #fff1ec;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07); --tabbar-bg: rgba(255,255,255,0.85);
    --dot-green: #34c759; --dot-purple: #af52de; --dot-blue: #0a84ff; --dot-pink: #ff2d78;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68; --accent-soft: rgba(255,138,104,0.14);
      --card-bg: #242426; --border: rgba(255,255,255,0.09); --tabbar-bg: rgba(28,28,30,0.85);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .appheader { padding:4px 20px 10px; }
  .appheader h2 { margin:0; font-size:28px; font-weight:800; color:var(--text); }
  .searchbar {
    display:flex; align-items:center; gap:8px;
    background:var(--card-bg); border-radius:12px; padding:9px 12px; margin:2px 20px 14px;
    color:var(--text-secondary); font-size:14px;
  }
  .content { flex:1; overflow-y:auto; padding:0 20px 20px; }
  .card {
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-top:1px solid var(--border);
  }
  .content .card:first-child { border-top:none; }
  .icon-badge { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .badge-green { background:rgba(52,199,89,0.14); color:var(--dot-green); }
  .badge-purple { background:rgba(175,82,222,0.14); color:var(--dot-purple); }
  .badge-blue { background:rgba(10,132,255,0.14); color:var(--dot-blue); }
  .badge-pink { background:rgba(255,45,120,0.14); color:var(--dot-pink); }
  .card .name { font-size:14.5px; font-weight:700; color:var(--text); }
  .card .meta { font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .subbtn {
    margin-left:auto; flex-shrink:0;
    font-size:12px; font-weight:700; color:var(--accent);
    border:1.4px solid var(--accent); border-radius:14px; padding:6px 13px;
  }
  .tabbar { display:flex; border-top:1px solid var(--border); background:var(--tabbar-bg); backdrop-filter:blur(10px); padding:8px 0 18px; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--text-secondary); }
  .tab.active { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
  <div class="caption">
    <h1>探す画面</h1>
    <p>公開リストの検索(§57)。検索前は人気/新着などを並べてもよいが、MVPでは検索バー＋結果一覧のみで十分。カード右の「登録」ボタンでその場から購読できる導線にした。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="appheader"><h2>探す</h2></div>
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="19.5" y1="19.5" x2="15.3" y2="15.3"/></svg>
      三田市 ゴミ
    </div>
    <div class="content">
      <div class="card">
        <div class="icon-badge badge-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M12 3c1.2 3.1-2 4.4-2 7.4a4 4 0 1 0 8 0c0-1.1-.7-2-1-2.8 1.3 1.1 2.3 3 2.3 5.2a6.3 6.3 0 1 1-12.6 0c0-4.3 3.1-6.7 5.3-9.8z"/></svg>
        </div>
        <div>
          <div class="name">三田市 ○○地区 ゴミの日</div>
          <div class="meta">作成者：三田市役所 ・ 4件の予定</div>
        </div>
        <div class="subbtn">登録</div>
      </div>
      <div class="card">
        <div class="icon-badge badge-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21.5"/></svg>
        </div>
        <div>
          <div class="name">○○ WORLD TOUR 2027</div>
          <div class="meta">作成者：○○ Official ・ 6件の予定</div>
        </div>
        <div class="subbtn">登録</div>
      </div>
      <div class="card">
        <div class="icon-badge badge-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="2.5" y="8" width="19" height="10" rx="4"/><circle cx="15.5" cy="12" r="0.9" fill="currentColor" stroke="none"/><circle cx="18" cy="14.5" r="0.9" fill="currentColor" stroke="none"/></svg>
        </div>
        <div>
          <div class="name">2026年 秋の新作ゲーム発売日</div>
          <div class="meta">作成者：ゲーム好き太郎 ・ 12件の予定</div>
        </div>
        <div class="subbtn">登録</div>
      </div>
      <div class="card">
        <div class="icon-badge badge-pink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        </div>
        <div>
          <div class="name">三田市 地域イベントまとめ</div>
          <div class="meta">作成者：三田市シティプロモーション課 ・ 8件の予定</div>
        </div>
        <div class="subbtn">登録</div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><path d="M3.5 10.5L12 3.5l8.5 7"/><path d="M5.5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h3v-6h4v6h3A1.5 1.5 0 0 0 18.5 19V9.5"/></svg>
        ホーム
      </div>
      <div class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="19.5" y1="19.5" x2="15.3" y2="15.3"/></svg>
        探す
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="21" height="21"><line x1="9" y1="6.5" x2="20.5" y2="6.5"/><line x1="9" y1="12" x2="20.5" y2="12"/><line x1="9" y1="17.5" x2="20.5" y2="17.5"/><line x1="4" y1="6.5" x2="4.01" y2="6.5"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="17.5" x2="4.01" y2="17.5"/></svg>
        マイリスト
      </div>
    </div>
  </div>
</body>
</html>
