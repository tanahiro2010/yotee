<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee 設定トップ画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a; --accent-soft:#fff1ec;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68; --accent-soft:rgba(255,138,104,0.14);
      --card-bg: #242426; --border: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .navheader { display:flex; align-items:center; padding:6px 14px 8px; }
  .navheader .back { color:var(--accent); }
  .appheader { padding:0 20px 14px; }
  .appheader h2 { margin:0; font-size:28px; font-weight:800; color:var(--text); }
  .content { flex:1; overflow-y:auto; padding:0 20px 20px; }

  .profile {
    display:flex; align-items:center; gap:12px; padding:13px 14px;
    background:var(--card-bg); border-radius:14px; margin-bottom:22px;
  }
  .avatar { width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:17px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .profile .name { font-size:14.5px; font-weight:700; color:var(--text); }
  .profile .email { font-size:11.5px; color:var(--text-secondary); margin-top:1px; }
  .profile .chev { margin-left:auto; color:var(--text-secondary); }

  .grouplabel { font-size:12px; font-weight:700; color:var(--text-secondary); margin:0 4px 8px; text-transform:uppercase; letter-spacing:0.03em; }
  .card { background:var(--card-bg); border-radius:14px; margin-bottom:22px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 14px; border-top:1px solid var(--border); }
  .card .row:first-child { border-top:none; }
  .row .icon-badge { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--accent-soft); color:var(--accent); }
  .row .label { font-size:14px; font-weight:600; color:var(--text); }
  .row .value { margin-left:auto; font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .version { text-align:center; font-size:11px; color:var(--text-secondary); margin-top:6px; }
</style>
</head>
<body>
  <div class="caption">
    <h1>設定トップ画面</h1>
    <p>マイリスト画面右上の歯車から遷移する独立ページ(settings/index.tsx)。プロフィール行をタップするとアカウント設定画面(前回作成分)に入る二段構成。新規予定作成時の初期通知タイミングをここでカスタマイズできる。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="navheader">
      <span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 5 8 12 15 19"/></svg></span>
    </div>
    <div class="appheader"><h2>設定</h2></div>
    <div class="content">
      <div class="profile">
        <div class="avatar">田</div>
        <div>
          <div class="name">田中 太郎</div>
          <div class="email">taro@example.com</div>
        </div>
        <div class="chev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 5 16 12 9 19"/></svg>
        </div>
      </div>

      <div class="grouplabel">通知</div>
      <div class="card">
        <div class="row">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.35 1.77-1 2.4L5 15h14l-1-1.1c-.65-.63-1-1.5-1-2.4V8a5 5 0 0 0-5-5z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
          </div>
          <div class="label">通知許可</div>
          <div class="value">
            オン
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 5 16 12 9 19"/></svg>
          </div>
        </div>
        <div class="row">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          </div>
          <div class="label">デフォルトの通知タイミング</div>
          <div class="value">
            前日の夜
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 5 16 12 9 19"/></svg>
          </div>
        </div>
      </div>

      <div class="grouplabel">サポート</div>
      <div class="card">
        <div class="row">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 1.9-2.4 3.5"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
          </div>
          <div class="label">ヘルプ・お問い合わせ</div>
          <div class="value">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 5 16 12 9 19"/></svg>
          </div>
        </div>
        <div class="row">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M6 3h9l3 3v15H6z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
          </div>
          <div class="label">利用規約・プライバシーポリシー</div>
          <div class="value">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 5 16 12 9 19"/></svg>
          </div>
        </div>
      </div>

      <div class="version">Yotee v0.1.0</div>
    </div>
  </div>
</body>
</html>
