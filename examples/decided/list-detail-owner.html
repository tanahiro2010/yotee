<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee リスト詳細画面(オーナー)</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07); --dot-green:#34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68;
      --card-bg: #242426; --border: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .navheader { display:flex; align-items:center; justify-content:space-between; padding:8px 14px 4px; }
  .navheader .back, .navheader .kebab { color:var(--text-secondary); }
  .titleblock { padding:6px 20px 14px; }
  .titleblock h2 { margin:0; font-size:22px; font-weight:800; color:var(--text); }
  .visibility {
    display:inline-flex; align-items:center; font-size:11px; font-weight:700; margin-top:6px;
    padding:3px 9px; border-radius:9px; background:var(--border); color:var(--text-secondary);
  }
  .content { flex:1; overflow-y:auto; padding:0 20px 20px; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--border); }
  .content .row:first-child { border-top:none; }
  .icon-badge { width:40px; height:40px; border-radius:12px; background:rgba(52,199,89,0.14); color:var(--dot-green); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row .name { font-size:15px; font-weight:600; color:var(--text); }
  .row .sub { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .toggle {
    margin-left:auto; flex-shrink:0; width:44px; height:26px; border-radius:14px;
    background:var(--accent); position:relative;
  }
  .toggle::after {
    content:""; position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; background:#fff;
  }
  .toggle.off { background:var(--border); }
  .toggle.off::after { right:auto; left:2px; }
  .addrow {
    display:flex; align-items:center; gap:10px; padding:13px 14px; margin-top:14px;
    border:1.6px dashed var(--border); border-radius:14px; color:var(--accent); font-weight:700; font-size:14px;
  }
</style>
</head>
<body>
  <div class="caption">
    <h1>リスト詳細画面(オーナー視点)</h1>
    <p>自分のリストの予定一覧。予定ごとに通知ON/OFFトグルを直接置いた(§12)。右上「…」からリスト単位の公開/共有/削除メニュー(§15)、下部から予定追加へ。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="navheader">
      <span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 5 8 12 15 19"/></svg></span>
      <span class="kebab"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg></span>
    </div>
    <div class="titleblock">
      <h2>三田市 ゴミの日</h2>
      <span class="visibility">非公開</span>
    </div>
    <div class="content">
      <div class="row">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 3c1.2 3.1-2 4.4-2 7.4a4 4 0 1 0 8 0c0-1.1-.7-2-1-2.8 1.3 1.1 2.3 3 2.3 5.2a6.3 6.3 0 1 1-12.6 0c0-4.3 3.1-6.7 5.3-9.8z"/></svg>
        </div>
        <div>
          <div class="name">燃えるゴミ</div>
          <div class="sub">毎週 火・金 ・ 前日の夜</div>
        </div>
        <div class="toggle"></div>
      </div>
      <div class="row">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M3.5 10.5V9a4 4 0 0 1 4-4h13"/><path d="M7 21.5L3.5 18l3.5-3.5"/><path d="M20.5 13.5V15a4 4 0 0 1-4 4h-13"/></svg>
        </div>
        <div>
          <div class="name">プラスチック</div>
          <div class="sub">毎週 水 ・ 前日の夜</div>
        </div>
        <div class="toggle"></div>
      </div>
      <div class="row">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M3.5 10.5V9a4 4 0 0 1 4-4h13"/><path d="M7 21.5L3.5 18l3.5-3.5"/><path d="M20.5 13.5V15a4 4 0 0 1-4 4h-13"/></svg>
        </div>
        <div>
          <div class="name">資源ごみ</div>
          <div class="sub">毎月 第2・第4月曜 ・ 前日の夜</div>
        </div>
        <div class="toggle"></div>
      </div>
      <div class="row">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M3.5 10.5V9a4 4 0 0 1 4-4h13"/><path d="M7 21.5L3.5 18l3.5-3.5"/><path d="M20.5 13.5V15a4 4 0 0 1-4 4h-13"/></svg>
        </div>
        <div>
          <div class="name">燃えないゴミ</div>
          <div class="sub">第2木曜日</div>
        </div>
        <div class="toggle off"></div>
      </div>
      <div class="addrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        予定を追加
      </div>
    </div>
  </div>
</body>
</html>
