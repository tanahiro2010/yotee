<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee 新しいリスト作成画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a; --accent-soft: #fff1ec;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07); --dot-green:#34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68; --accent-soft: rgba(255,138,104,0.14);
      --card-bg: #242426; --border: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .modalheader {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 12px; border-bottom:1px solid var(--border);
  }
  .modalheader .cancel { font-size:14px; color:var(--text-secondary); }
  .modalheader .title { font-size:15px; font-weight:700; color:var(--text); }
  .modalheader .save { font-size:14px; font-weight:700; color:var(--accent-disabled, var(--text-secondary)); }
  .content { flex:1; overflow-y:auto; padding:22px 20px; }
  .field-label { font-size:12px; font-weight:700; color:var(--text-secondary); margin:0 2px 8px; text-transform:uppercase; letter-spacing:0.03em; }
  .input {
    background:var(--card-bg); border-radius:12px; padding:13px 14px;
    font-size:15px; color:var(--text); margin-bottom:26px;
  }
  .input.placeholder { color:var(--text-secondary); }
  .itemsbox { background:var(--card-bg); border-radius:14px; overflow:hidden; margin-bottom:16px; }
  .itemrow { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--border); }
  .itemsbox .itemrow:first-child { border-top:none; }
  .icon-badge { width:36px; height:36px; border-radius:10px; background:rgba(52,199,89,0.14); color:var(--dot-green); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .itemrow .name { font-size:14px; font-weight:600; color:var(--text); }
  .itemrow .sub { font-size:11.5px; color:var(--text-secondary); margin-top:1px; }
  .addrow {
    display:flex; align-items:center; gap:10px; padding:13px 14px;
    border:1.6px dashed var(--border); border-radius:14px; color:var(--accent); font-weight:700; font-size:14px;
  }
</style>
</head>
<body>
  <div class="caption">
    <h1>新しいリスト作成画面</h1>
    <p>PRD §15そのまま：モーダルで開き、必須は名前だけ。「＋予定を追加」から items/new へ遷移する想定。公開設定などの高度な機能は作成直後には出さず、保存後に「…」メニューから開く。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="modalheader">
      <span class="cancel">キャンセル</span>
      <span class="title">新しいリスト</span>
      <span class="save" style="color:var(--accent)">保存</span>
    </div>
    <div class="content">
      <div class="field-label">名前</div>
      <div class="input">ゴミの日</div>

      <div class="field-label">予定</div>
      <div class="itemsbox">
        <div class="itemrow">
          <div class="icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M12 3c1.2 3.1-2 4.4-2 7.4a4 4 0 1 0 8 0c0-1.1-.7-2-1-2.8 1.3 1.1 2.3 3 2.3 5.2a6.3 6.3 0 1 1-12.6 0c0-4.3 3.1-6.7 5.3-9.8z"/></svg>
          </div>
          <div>
            <div class="name">燃えるゴミ</div>
            <div class="sub">毎週 火・金 ・ 前日の夜</div>
          </div>
        </div>
      </div>
      <div class="addrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        予定を追加
      </div>
    </div>
  </div>
</body>
</html>
