<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee 予定詳細画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a; --danger:#ff3b30;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07); --dot-green:#34c759;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68; --danger:#ff453a;
      --card-bg: #242426; --border: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .navheader { display:flex; align-items:center; padding:6px 14px 4px; }
  .navheader .back { color:var(--accent); }
  .herowrap { display:flex; flex-direction:column; align-items:center; padding:14px 20px 22px; text-align:center; }
  .icon-badge { width:60px; height:60px; border-radius:16px; background:rgba(52,199,89,0.14); color:var(--dot-green);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .herowrap h2 { margin:0; font-size:20px; font-weight:800; color:var(--text); }
  .herowrap .list { font-size:12.5px; color:var(--text-secondary); margin-top:4px; }
  .content { flex:1; overflow-y:auto; padding:0 20px 20px; }
  .card { background:var(--card-bg); border-radius:14px; overflow:hidden; margin-bottom:22px; }
  .row { display:flex; align-items:center; gap:10px; padding:13px 14px; border-top:1px solid var(--border); }
  .card .row:first-child { border-top:none; }
  .row .rowicon { color:var(--text-secondary); flex-shrink:0; }
  .row .label { font-size:14.5px; font-weight:600; color:var(--text); }
  .row .value { margin-left:auto; font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .deletebtn { text-align:center; font-size:14.5px; font-weight:700; color:var(--danger); padding:12px; }
</style>
</head>
<body>
  <div class="caption">
    <h1>予定詳細画面</h1>
    <p>作成フォーム(item-new)とは分けて、確定済みの内容をグループドリストで見せ、各行タップで編集モーダルを開く設計に。リスト詳細から遷移してくる想定で、一番下に削除導線。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="navheader">
      <span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 5 8 12 15 19"/></svg></span>
    </div>
    <div class="herowrap">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><path d="M12 3c1.2 3.1-2 4.4-2 7.4a4 4 0 1 0 8 0c0-1.1-.7-2-1-2.8 1.3 1.1 2.3 3 2.3 5.2a6.3 6.3 0 1 1-12.6 0c0-4.3 3.1-6.7 5.3-9.8z"/></svg>
      </div>
      <h2>燃えるゴミ</h2>
      <div class="list">三田市 ゴミの日</div>
    </div>
    <div class="content">
      <div class="card">
        <div class="row">
          <span class="label">いつ</span>
          <span class="value">
            毎週 火・金
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="9 5 16 12 9 19"/></svg>
          </span>
        </div>
        <div class="row">
          <span class="label">通知するタイミング</span>
          <span class="value">
            前日の夜
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="9 5 16 12 9 19"/></svg>
          </span>
        </div>
        <div class="row">
          <span class="label">この予定を通知する</span>
          <span class="value" style="color:var(--dot-green); font-weight:700;">オン</span>
        </div>
      </div>
      <div class="deletebtn">この予定を削除</div>
    </div>
  </div>
</body>
</html>
