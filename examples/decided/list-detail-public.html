<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee 公開リスト詳細画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07); --dot-purple:#af52de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68;
      --card-bg: #242426; --border: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .navheader { display:flex; align-items:center; justify-content:space-between; padding:8px 14px 4px; }
  .navheader .back, .navheader .share { color:var(--text-secondary); }
  .titleblock { padding:6px 20px 14px; }
  .titleblock h2 { margin:0; font-size:22px; font-weight:800; color:var(--text); }
  .titleblock .creator { font-size:12.5px; color:var(--text-secondary); margin-top:6px; }
  .content { flex:1; overflow-y:auto; padding:0 20px 140px; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--border); }
  .content .row:first-child { border-top:none; }
  .icon-badge { width:40px; height:40px; border-radius:12px; background:rgba(175,82,222,0.14); color:var(--dot-purple); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row .name { font-size:15px; font-weight:600; color:var(--text); }
  .row .sub { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .footer {
    position:absolute; left:0; right:0; bottom:0;
    background:var(--phone-bg); border-top:1px solid var(--border);
    padding:14px 20px 26px;
  }
  .footer .reco { font-size:12px; color:var(--text-secondary); margin-bottom:10px; text-align:center; }
  .cta {
    background:var(--accent); color:#fff; text-align:center;
    font-size:15.5px; font-weight:800; padding:14px; border-radius:14px;
  }
</style>
</head>
<body>
  <div class="caption">
    <h1>公開リスト詳細画面(訪問者・購読前)</h1>
    <p>「探す」または共有URLからの遷移先(§18)。読み取り専用の予定一覧＋下部固定のCTAで、登録操作を1ボタンで完結させる。登録すると「おすすめ通知設定確認」モーダルへ進む(Flow B)。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="navheader">
      <span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 5 8 12 15 19"/></svg></span>
      <span class="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><line x1="8.2" y1="10.8" x2="15.8" y2="6.2"/><line x1="8.2" y1="13.2" x2="15.8" y2="17.8"/></svg></span>
    </div>
    <div class="titleblock">
      <h2>○○ WORLD TOUR 2027</h2>
      <div class="creator">作成者：○○ Official</div>
    </div>
    <div class="content">
      <div class="row">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a2.3 2.3 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a2.3 2.3 0 0 0 0-3.6z"/></svg></div>
        <div><div class="name">FC先行受付開始</div><div class="sub">2026年9月1日</div></div>
      </div>
      <div class="row">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a2.3 2.3 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a2.3 2.3 0 0 0 0-3.6z"/></svg></div>
        <div><div class="name">FC先行締切</div><div class="sub">2026年9月3日</div></div>
      </div>
      <div class="row">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 8.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.7a2.3 2.3 0 0 0 0 3.6v1.7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.7a2.3 2.3 0 0 0 0-3.6z"/></svg></div>
        <div><div class="name">一般販売開始</div><div class="sub">2026年9月10日</div></div>
      </div>
      <div class="row">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/></svg></div>
        <div><div class="name">東京公演</div><div class="sub">2026年9月15日</div></div>
      </div>
      <div class="row">
        <div class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/></svg></div>
        <div><div class="name">大阪公演</div><div class="sub">2026年9月20日</div></div>
      </div>
    </div>
    <div class="footer">
      <div class="reco">おすすめ通知：前日の20:00</div>
      <div class="cta">このリストを登録</div>
    </div>
  </div>
</body>
</html>
