<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yotee リスト編集画面</title>
<style>
  :root {
    --bg: #f2f2f7; --page-text: #1c1c1e; --phone-bg: #ffffff; --text: #1c1c1e;
    --text-secondary: #8e8e93; --accent: #ff6b4a; --danger:#ff3b30;
    --card-bg: #f7f7f9; --border: rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --page-text: #f5f5f7; --phone-bg: #1c1c1e; --text: #f5f5f7;
      --text-secondary: #9a9a9e; --accent: #ff8a68; --danger:#ff453a;
      --card-bg: #242426; --border: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px; padding:40px 16px 60px; }
  .caption { text-align:center; max-width:340px; }
  .caption h1 { font-size:16px; margin:0 0 4px; }
  .caption p { font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5; }
  .phone { width:375px; max-width:100%; height:780px; background:var(--phone-bg); border-radius:44px;
    box-shadow:0 30px 60px rgba(0,0,0,0.25); overflow:hidden; position:relative; display:flex; flex-direction:column; border:8px solid #0b0b0d; }
  .statusbar { display:flex; justify-content:space-between; align-items:center; padding:16px 24px 4px; font-size:13px; font-weight:600; color:var(--text); }
  .statusicons { display:flex; align-items:center; gap:6px; color:var(--text); }
  .modalheader { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 12px; border-bottom:1px solid var(--border); }
  .modalheader .cancel { font-size:14px; color:var(--text-secondary); }
  .modalheader .title { font-size:15px; font-weight:700; color:var(--text); }
  .modalheader .save { font-size:14px; font-weight:700; color:var(--accent); }
  .content { flex:1; overflow-y:auto; padding:22px 20px; }
  .field-label { font-size:12px; font-weight:700; color:var(--text-secondary); margin:0 2px 8px; text-transform:uppercase; letter-spacing:0.03em; }
  .input { background:var(--card-bg); border-radius:12px; padding:13px 14px; font-size:15px; color:var(--text); margin-bottom:22px; }
  textarea.input { min-height:56px; color:var(--text-secondary); }
  .card { background:var(--card-bg); border-radius:12px; overflow:hidden; margin-bottom:28px; }
  .row { display:flex; align-items:center; gap:10px; padding:13px 14px; }
  .row .label { font-size:14.5px; font-weight:600; color:var(--text); }
  .row .value { margin-left:auto; font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .deletebtn { text-align:center; font-size:14.5px; font-weight:700; color:var(--danger); padding:12px; }
</style>
</head>
<body>
  <div class="caption">
    <h1>リスト編集画面</h1>
    <p>名前・説明の編集フォーム＋公開設定は別モーダルへの導線として1行にまとめた(§17)。一番下に削除への導線を置くが、誤操作を避けるため確認ダイアログを挟む想定。</p>
  </div>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusicons">
        <svg viewBox="0 0 20 12" width="17" height="10" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>
        <svg viewBox="0 0 24 16" width="23" height="13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="19" height="10" rx="2.5"/><rect x="21.5" y="5.5" width="1.6" height="3" rx="0.6" fill="currentColor" stroke="none"/><rect x="3" y="4" width="14" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
    <div class="modalheader">
      <span class="cancel">キャンセル</span>
      <span class="title">リストを編集</span>
      <span class="save">保存</span>
    </div>
    <div class="content">
      <div class="field-label">名前</div>
      <div class="input">三田市 ゴミの日</div>

      <div class="field-label">説明</div>
      <div class="input" style="color:var(--text-secondary)">三田市○○地区のゴミ収集日をまとめています</div>

      <div class="field-label">公開設定</div>
      <div class="card">
        <div class="row">
          <span class="label">公開範囲</span>
          <span class="value">
            非公開
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="9 5 16 12 9 19"/></svg>
          </span>
        </div>
      </div>

      <div class="deletebtn">このリストを削除</div>
    </div>
  </div>
</body>
</html>
