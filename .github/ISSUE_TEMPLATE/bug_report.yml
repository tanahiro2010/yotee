name: バグ報告
description: 動作不良や期待と異なる挙動を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたか簡潔に
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: プラットフォーム
      options:
        - iOS
        - Android
        - Backend
        - 両方 / 不明
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補足情報
      description: ログ、スクリーンショット、関連するPRDの節番号など
